<!doctype html>
<html lang="en">
<head>

<style>
@font-face{font-family:'Outfit';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/outfit-500.woff2) format('woff2')}
:root{color-scheme:light;--bg:#EFF0F2;--text:#1E2233;--muted:#555B6E;--line:#D9DBE2;--link:#4F3BD0;--grad:linear-gradient(45deg,#3B5BDB,#7C3AED)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.6;position:relative;min-height:100vh}
.tex{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body>*:not(.tex){position:relative;z-index:1}
a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(79,59,208,.35)}
a:focus-visible{outline:2px solid #7C3AED;outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 32px}
.bar{padding:22px 0}
.brand{display:inline-flex;align-items:center;gap:10px;border:0;min-height:44px}
.word{font-size:17px;letter-spacing:.2em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:60px 0 18px;font-size:14px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.info{font-size:22px;margin:0 0 80px}
@media(max-width:640px){.wrap{padding:0 16px}}
</style>
</head>
<body>
